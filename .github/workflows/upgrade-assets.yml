name: Upgrade image assets

on:
  push:
    paths:
      - '.github/workflows/upgrade-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Unpack high-quality assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/images
          for z in .asset_payload_hq/*.zip; do
            unzip -o "$z" -d game/images
          done

          count="$(find game/images -type f -name '*.png' | wc -l)"
          test "$count" -ge 21

          # Sanity checks: ensure we did not retain the tiny bootstrap versions.
          test "$(stat -c%s game/images/bg_ball_corner.png)" -gt 100000
          test "$(stat -c%s game/images/characters/elizabeth_ball_neutral.png)" -gt 30000

          rm -rf .asset_payload_hq

      - name: Commit upgraded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/images
          git add -A .asset_payload_hq || true
          git commit -m "Upgrade 21 PNG game assets"
          git push origin HEAD:main
