name: Restore image assets

on:
  push:
    paths:
      - '.github/workflows/restore-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore PNG assets
        run: |
          set -euo pipefail
          mkdir -p game/images
          unzip -o .asset_payload/first_impression_assets_micro.zip -d game/images
          test "$(find game/images -type f -name '*.png' | wc -l)" -ge 21
          git rm .asset_payload/first_impression_assets_micro.zip

      - name: Commit restored assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/images
          git commit -m "Restore 21 PNG game assets"
          git push origin HEAD:main
